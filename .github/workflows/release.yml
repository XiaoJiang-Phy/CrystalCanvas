name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  preflight:
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      release_ref: ${{ steps.identity.outputs.ref }}
      release_tag: ${{ steps.identity.outputs.tag }}
      release_version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: bind the release tag to the checked-out candidate
        id: identity
        run: |
          node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        run: npm install -g pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: validate Rust release gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --all-targets --no-fail-fast --manifest-path src-tauri/Cargo.toml

      - name: validate C++ release gates
        run: |
          cmake -S cpp/tests -B cpp/tests/build
          cmake --build cpp/tests/build
          ctest --test-dir cpp/tests/build --output-on-failure

      - name: validate IPC and frontend release gates
        run: |
          npm run ipc:inventory
          git diff --exit-code -- ipc/inventory.json src/ipc/commands.generated.ts
          npm run check:ipc
          npm run test:ipc
          node --test tests/field_1_red_gate.test.mjs scripts/blender-field-export.test.mjs scripts/field-workflow-ui.test.mjs scripts/release-closure.test.mjs scripts/release-notes.test.mjs
          ./node_modules/.bin/tsc --noEmit
          pnpm run build
          git diff --check
          test -z "$(git status --porcelain)"

      - name: validate active release closure
        env:
          CRYSTALCANVAS_RELEASE_PUBLISH: "1"
        run: CRYSTALCANVAS_RELEASE_PUBLISH=1 node --test tests/release_2_red_gate.test.mjs

      - name: create a draft bound to the validated candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 1
          fi
          node scripts/release-notes.mjs "$version" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --draft --title "CrystalCanvas $GITHUB_REF_NAME" --notes-file release-notes.md

  bundle:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        run: npm install -g pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: build draft release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.preflight.outputs.release_tag }}
          releaseName: CrystalCanvas ${{ needs.preflight.outputs.release_tag }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: [preflight, bundle]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}
          fetch-depth: 0

      - name: verify publication identity
        run: node scripts/validate-release-tag.mjs "${{ needs.preflight.outputs.release_tag }}" "${{ needs.preflight.outputs.release_ref }}"

      - name: attach release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.preflight.outputs.release_tag }}" "release/v${{ needs.preflight.outputs.release_version }}/release-evidence.json" --clobber

      - name: publish the completed draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs "${{ needs.preflight.outputs.release_version }}" > release-notes.md
          gh release edit "${{ needs.preflight.outputs.release_tag }}" --notes-file release-notes.md --draft=false --latest
