name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Immutable release-candidate commit SHA"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.8.0"
        type: string

jobs:
  preflight:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: bind dispatch inputs to the checked-out candidate
        run: node scripts/validate-release-dispatch.mjs "${{ inputs.ref }}" "${{ inputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        run: npm install -g pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: validate Rust release gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --all-targets --no-fail-fast --manifest-path src-tauri/Cargo.toml

      - name: validate C++ release gates
        run: |
          cmake -S cpp/tests -B cpp/tests/build
          cmake --build cpp/tests/build
          ctest --test-dir cpp/tests/build --output-on-failure

      - name: validate IPC and frontend release gates
        run: |
          npm run ipc:inventory
          git diff --exit-code -- ipc/inventory.json src/ipc/commands.generated.ts
          npm run check:ipc
          npm run test:ipc
          node --test tests/field_1_red_gate.test.mjs scripts/blender-field-export.test.mjs scripts/field-workflow-ui.test.mjs scripts/release-closure.test.mjs
          ./node_modules/.bin/tsc --noEmit
          pnpm run build
          git diff --check
          test -z "$(git status --porcelain)"

      - name: validate v0.8.0 release closure
        env:
          CRYSTALCANVAS_RELEASE_PUBLISH: "1"
        run: CRYSTALCANVAS_RELEASE_PUBLISH=1 node --test tests/release_2_red_gate.test.mjs

      - name: create a draft bound to the validated candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "draft tag v${{ inputs.version }} already exists"
            exit 1
          fi
          gh release create "v${{ inputs.version }}" --target "${{ inputs.ref }}" --draft --title "CrystalCanvas v${{ inputs.version }}" --notes "Validated RELEASE-2 evidence is attached after both macOS bundles complete."

  bundle:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        run: npm install -g pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: build draft release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: CrystalCanvas v${{ inputs.version }}
          releaseBody: "Validated RELEASE-2 evidence is attached after both macOS bundles complete."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: [preflight, bundle]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: verify publication identity
        run: node scripts/validate-release-dispatch.mjs "${{ inputs.ref }}" "${{ inputs.version }}"

      - name: attach release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ inputs.version }}" "release/v${{ inputs.version }}/release-evidence.json" --clobber

      - name: publish the completed draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v${{ inputs.version }} --draft=false --latest
